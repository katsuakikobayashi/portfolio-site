[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24.22.0"
  NPM_FLAGS = "--no-audit --no-fund"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # GTM/GA4 を有効化する際は script-src に配信元を追加すること。
    # img-src の images.microcms-assets.io は microCMS 画像 API（TOP スライド・About 写真）の配信元。
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://images.microcms-assets.io; font-src 'self'; form-action 'none'; frame-ancestors 'none'; base-uri 'self'"

# ハッシュ付きで出力されるビルド成果物は不変のため長期キャッシュ
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
